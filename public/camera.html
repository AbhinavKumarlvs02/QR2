<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Camera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        #camera {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
        }

        #box {
            position: absolute;

            width: 70%;
            aspect-ratio: 1;

            left: 15%;
            top: 50%;

            transform: translateY(-50%);

            border: 3px solid #00ff66;

            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.35);

            pointer-events: none;

            z-index: 2;
        }

        #controls {
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
        }

        #zoom {
            width: 100%;
        }

        #zoomValue {
            margin-top: 8px;
            font-size: 16px;
        }

        #status {
            padding: 10px;
            font-size: 16px;
        }

        #counter {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <h2>QR Camera</h2>

    <div id="camera">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div id="box"></div>

    </div>

    <div id="controls">

        <label for="zoom">
            Zoom
        </label>

        <input
            id="zoom"
            type="range"
            min="1"
            max="4"
            step="0.1"
            value="1">

        <div id="zoomValue">
            1.0x
        </div>

    </div>

    <div id="status">
        Starting camera...
    </div>

    <div id="counter">
        Frames sent: 0
    </div>

    <script src="/camera.js"></script>

</body>
</html>
